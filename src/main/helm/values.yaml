app:
  name: bff
  image:
    repository: "onecx/onecx-human-task-bff"
  operator:
    # Permission
    permission:
      enabled: true
      spec:
        permissions:
          task:
            read: permission on all GET requests and POST search
            write: permission on PUT, POST, PATCH requests, where objects are saved or updated
            delete: permission on all DELETE requests
    keycloak:
      client:
        enabled: true
        spec:
          kcConfig:
            defaultClientScopes: [ ocx-ht:all ]
    microservice:
      spec:
        description: onecx-human-task-bff
        name: onecx-human-task-bff

